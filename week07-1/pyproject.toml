[project]
name = "fastapi-project-template"
version = "0.1.0"
description = "Reusable FastAPI project template"
authors = [{ name = "Sneha Gada" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn>=0.30.6,<0.31.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "alembic>=1.20.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.2,<9.0.0",
    "httpx>=0.27.2,<0.28.0",
    "mypy>=1.11.2,<2.0.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
