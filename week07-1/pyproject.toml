[tool.poetry]
name = "fastapi-project-template"
version = "0.1.0"
description = "Reusable FastAPI project template"
authors = ["Sneha Gada"]

package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115.0"
uvicorn = "^0.30.6"
pydantic-settings = "^2.4.0"
alembic = "^1.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
httpx = "^0.27.2"
mypy = "^1.11.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"